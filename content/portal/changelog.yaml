entries:
- date: '2026-09-24'
  id: safedep-catalog-pass
  title: 'SafeDep catalog: attach overlaps, add six new incidents'
  items:
  - Attached 34 SafeDep posts to existing incidents (Team PCP including Bitwarden CLI, Shai-Hulud waves,
    Miasma, Joyfill, mrmustard, Nx, prettier, Velora, Mastra, Moika, axios, arrayref, Keyv, sckit, 7nohe,
    PolinRider astro.config).
  - 'New AS83–AS94: ulid-xyz, Google bin harvesting, Baileys, @copilot-mcp/apex, nodemon-sudo, fake TradingView,
    @withgoogle/stitch-sdk, MYRA RAT, Megalodon, durabletask, Cline v2.3.0, Schedaero.'
  - Product/guidance posts (vet, MCP, SBOM, Gryph) skipped. Remaining SafeDep malware-package posts (Polymarket,
    wshu, Hyatt, sl4x0, …) for the next SafeDep slice.
- date: '2026-09-24'
  id: osm-catalog-pass
  title: 'OpenSourceMalware catalog: every incident post mapped'
  items:
  - Catalogued all 71 OSM RSS posts. Show/landscape/guidance posts skipped. Follow-up posts attached to
    existing stories (PolinRider, Team PCP, axios, Mini Shai-Hulud, Keyv, ClawHub, Contagious Interview).
  - 'New stories AS78–AS82: Velora SDK 9.4.1, CNCF Antrea Jenkins, Contagious Interview git hooks, XPACK
    extortion, Neutralinojs force-push.'
  - Added jenkins platform tag.
- date: '2026-09-24'
  id: history-pass-5b
  title: Add Moika dependency-confusion campaign
  items:
  - Added AS77 Moika (183 npm packages impersonating Sberbank/EMCD internal tooling) from OpenSourceMalware’s
    Jan–May 2026 campaign review.
- date: '2026-09-24'
  id: history-pass-5
  title: 'History pass 5: NotPetya, prettier phishing, Nx s1ngularity, hackerbot-claw'
  items:
  - 'Added AS71–AS76: NotPetya via M.E.Doc (ESET), eslint-config-prettier phishing, got-fetch Pycoon (Checkmarx),
    Nx s1ngularity (nx.dev), hackerbot-claw (StepSecurity), Aspect Security npm install-time stealers
    (OSM).'
  - 'Sources: ESET WeLiveSecurity, StepSecurity, Checkmarx Zero, Nx post-mortem, OpenSourceMalware.'
- date: '2026-09-24'
  id: history-pass-4
  title: 'History pass 4: Anthropic PyPI agent, Joyfill, mrmustard, SleeperGem, is, Mastra'
  items:
  - 'Added AS65–AS70: Anthropic eval agent on live PyPI, Joyfill npm RAT, mrmustard 0.7.4, SleeperGem
    RubyGems, npm is 3.3.1/5.0.0, @mastra/easy-day-js.'
  - 'Sources: Anthropic, StepSecurity, Aikido, OpenSourceMalware.'
- date: '2026-09-24'
  id: history-pass-3
  title: 'History pass 3: NuGet cheats, wallet drainers, ShadowHammer, Agama'
  items:
  - 'Added AS57–AS64: eleven NuGet game-cheat packages, Chrome/Edge wallet drainers, Injective SDK overwrite,
    77 Firefox wallet add-ons, fake corepack.org, ASUS ShadowHammer, DarkGPT VS Code extensions, electron-native-notify
    in Agama (2019).'
  - 'New platform tags: browser-extensions, macos.'
  - 'Sources: Socket, Kaspersky Securelist, SafeDep, Koi, npm blog.'
- date: '2026-09-23'
  id: history-pass-2
  title: 'History pass 2: Shai-Hulud, Miasma, GlassWorm, ClawHub, Packagist spyware'
  items:
  - 'Added AS48–AS56: Shai-Hulud first wave (@ctrl/tinycolor), Sha1-Hulud Second Coming, Miasma/@asyncapi,
    jscrambler 8.14.0, Packagist iOS spyware themes, ClawHub skills, Stardrop, GlassWorm, Elf-Stats.'
  - 'Sources: Socket and OpenSourceMalware first-party posts.'
- date: '2026-09-23'
  id: backfill-old-incidents
  title: Rewrite original stories and backfill older campaigns
  items:
  - Rewrote AS1 Webmin, AS4 PHP (date was wrongly 2023), AS5 CCleaner, AS107 Dependabot, AS108 JuiceStealer,
    AS109 PyTorch (was tagged as account takeover; it is T0120) with first-party sources and fuller technique
    maps.
  - 'Added AS41–AS47 from OpenSourceMalware and ESLint: Contagious Interview, IndonesianFoods worm, WEL1DROPPER,
    StubMaker, PolinRider campaign, eslint-scope 2018, VS Code dictionary/tasks droppers.'
- date: '2026-09-23'
  id: platform-aggregates
  title: Platform group pages (all npm incidents, etc.)
  items:
  - Added /platforms/ with counts per registry/platform and a dedicated list page per slug (e.g. /platforms/npm.html).
  - Incident chips and the incident-index bar link into those groups.
- date: '2026-09-23'
  id: incident-platforms
  title: Incidents tagged by platform / registry
  items:
  - 'Every attack story now has a platforms: list (npm, PyPI, RubyGems, Packagist, crates.io, Go, GitHub
    Actions, Terraform, CDN, AI agents, etc.).'
  - Incident index filters by platform. Vocabulary is content/portal/platforms.yaml.
- date: '2026-09-24'
  id: intake-2026-09-24
  title: sckit MemTensor worm and Graphalgo Terraform/Go
  items:
  - Added AS39 (sckit credential-harvesting launcher in @memtensor/memos-cloud-openclaw-plugin and PyPI
    MemoryOS 2.0.34, StepSecurity).
  - Added AS40 (Graphalgo Go malware in Terraform providers and Go modules, Aikido).
  - Added Aikido blog as a tracked research source.
- date: '2026-09-23'
  id: intake-2026-09-23
  title: tw-pkgprobe-7731 Twilio npm campaign
  items:
  - Added AS38 (tw-pkgprobe-7731 npm package targeting Twilio developers, ReversingLabs).
  - Added ReversingLabs blog as a tracked research source.
- date: '2026-09-23'
  id: osm-blog-url
  title: OpenSourceMalware watch URL is the blog, not the homepage
  items:
  - Tracked URL is now https://opensourcemalware.com/blog (RSS https://opensourcemalware.com/rss.xml).
    The site root is a threat-search UI.
- date: '2026-09-22'
  id: intake-2026-09-22
  title: GHAPPIER, PolinRider Packagist, mathmain, GemStuffer
  items:
  - Added AS34 (GHAPPIER / @dforge-core/dforge-mcp trusted-publishing loader, CloudSEK).
  - Added AS35 (PolinRider visanduma/nova-two-factor Packagist via Git, Socket).
  - Added AS36 (mathmain/mathsbase encrypted npm RAT, SafeDep and JFrog).
  - Added AS37 (GemStuffer RubyGems / RubyDoc.info YARD --load, SafeDep, RubyGems, RubyHack, JFrog).
  - Added T0211 (abuse registry-adjacent builders as remote execution).
  - Added CloudSEK as a tracked research source.
- date: '2026-09-21'
  id: tracked-sources
  title: Public tracked-source list (SafeDep added)
  items:
  - Added content/portal/sources.yaml and /sources.html as the canonical watch list.
  - SafeDep blog (https://safedep.io/blog/) is now a daily-tracked research source.
  - Daily intake reads this file; adding a source is an edit to sources.yaml.
- date: '2026-09-21'
  id: ssc-2026-late
  title: 'Late-2026 campaigns: runtime loaders, agent configs, registry origins'
  items:
  - Added T0209 (compromise package registry or CDN origin) and T0210 (poison AI coding-agent config).
  - Added AS25–AS33 from first-party research and advisories (Checkmarx, CrowdStrike, Mandiant/Google,
    Jared Wray, Morphisec, Coder GHSA, OpenSourceMalware, GTIG).
  - Mapped runtime-hidden npm loaders, hidden HTTP remote deps, valid-provenance publishes, llms.txt package
    confusion, and CDN origin-pool tampering.
- date: 2026-09-21
  id: technique-origins
  title: Where each technique idea came from
  items:
  - Added an origin kind and source URL on every technique, shown on the technique page and on /origins.html.
  - Five original techniques had no references (T0107, T0134, T0143, T0149, T0161); they now cite ATT&CK,
    OWASP, SLSA, or Birsan as the analog that justifies them.
- date: 2026-09-21
  id: portal-guidance-changelog
  title: Public changelog, guidance gap-fill, and technique provenance
  items:
  - Added this changelog to the site so portal work is visible without reading git history.
  - Compared OSC&R to OWASP Top 10 CI/CD, NIST SSDF (SP 800-218), SLSA threat model, CISA SSDF/EO 14028
    lineage, and OxSecurity/Cider CI/CD research (the original PBOM authors).
  - Added T0206 (forge or omit build provenance), T0207 (skip or forge artifact integrity), T0208 (compromise
    code-signing identity).
  - Mapped those onto existing stories where they already happened (SolarWinds signing, Codecov unsigned
    script, Polyfill without SRI).
  - Documented unused techniques as identified-from research or guidance, not as invented attacks. Matrix
    and technique pages now say observed vs identified.
- date: 2026-09-21
  id: incidents-2026-matrix
  title: 2026 incidents, matrix heat, search hides empty columns
  items:
  - Added AS16–AS22 from primary research (TanStack GHSA, OpenAI, CrowdSec, StepSecurity, CloudSEK, Rust
    blog, Brevo, Sansec, SafeDep).
  - Matrix cells show incident counts and heat; search hides non-matches and empty tactic columns.
  - Mapped previously unused techniques onto those cases where the fit was honest.
- date: 2026-09-21
  id: fork-launch
  title: AI-maintained fork and first public site
  items:
  - Forked pbom-dev/OSCAR to ai-anant/OSCAR. Attribution retained (Apache-2.0, NOTICE).
  - Published matrix, technique pages, and incident mappings on GitHub Pages.
  - Applied unmerged upstream PRs
  - Added T0200–T0203, T0205 and stories AS7–AS15.
