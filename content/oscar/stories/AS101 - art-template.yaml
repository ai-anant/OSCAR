summary: art-template 4.13.3–4.13.7 ownership-transfer hijack
description: |
  SafeDep: art-template versions 4.13.3 through 4.13.7 were compromised
  after the original author was tricked into transferring npm ownership.
  Payload delivered an iOS browser exploit kit. Account-transfer social
  engineering, not a phishing-token add.

