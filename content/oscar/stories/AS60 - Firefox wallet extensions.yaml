        tactic: Resource Development
        comment: 77 listings on addons.mozilla.org.
      - techniqueID: T0110
        techName: Advertise malicious artifact
        tactic: Resource Development
        comment: Wallet / Web3 impersonation in Firefox search.
      - techniqueID: T0136
        techName: Brandjacking
        tactic: Initial Access
