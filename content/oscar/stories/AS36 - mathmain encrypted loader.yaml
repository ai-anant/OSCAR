      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: mathsbase@1.0.1 (27 Aug), math-universe 1.0.0–1.0.2, mathmain@1.0.0 (17 Sep).
      - techniqueID: T0150
