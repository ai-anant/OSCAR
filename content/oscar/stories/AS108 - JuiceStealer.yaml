id: AS108
type: Attack Story
date: 2022-02
platforms:
  - pypi

summary: JuiceStealer PyPI phishing and typosquats
description: |
  Checkmarx documented the first known phishing campaign against PyPI
  maintainers: fake “validate your PyPI credentials” mail to a lookalike
  login page. At least two legitimate packages were then published with
  JuiceStealer (exotel 0.1.6; spam 2.0.2 / 4.0.2), stealing crypto-wallet
  material and later Chrome passwords. The same malware was also pushed
  through hundreds of typosquat names. SentinelOne later tied the cluster
  to JuiceLedger activity dating to late 2021.

attacks:
  - attack: PyPI maintainers
    index: 1
    stage: supply-chain
    customer: 0
    supplier: 2
    techniques:
      - techniqueID: T0113
        techName: Compromised user account
        tactic: Initial Access
        comment: Phishing to a fake PyPI login stole maintainer credentials.
      - techniqueID: T0109
        techName: Publish malicious artifact
        tactic: Resource Development
        comment: Poisoned versions of exotel and spam plus hundreds of typosquats.
      - techniqueID: T0129
        techName: Typosquatting
        tactic: Initial Access
        comment: Parallel upload of lookalike package names carrying JuiceStealer.
      - techniqueID: T0111
        techName: Malicious code contribution to an open-source repository
        tactic: Resource Development
        comment: Malicious code landed in already-trusted package names.
  - attack: PyPI consumers
    index: 2
    stage: post-supply-chain
    customer: 1
    supplier: 0
    techniques:
      - techniqueID: T0159
        techName: Malicious artifact execution
        tactic: Execution
        comment: Installing the poisoned versions ran JuiceStealer.
      - techniqueID: T0139
        techName: Resource hijacking
        tactic: Impact
        comment: Crypto-wallet theft, later expanded to Chrome password theft.
      - techniqueID: T0201
        techName: Customers compromised
        tactic: Impact
        comment: Hundreds of thousands of historical downloads on the hijacked names.

links:
  - https://checkmarx.com/blog/first-known-phishing-attack-against-pypi-users/
