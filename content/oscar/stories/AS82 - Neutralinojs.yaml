        tactic: Resource Development
        comment: Whitespace-hidden JS loaders in four org repos.
      - techniqueID: T0169
        techName: Push implants across repositories
        tactic: Lateral Movement
        comment: Four repos plus extra branches in 132 seconds.
      - techniqueID: T0172
        techName: Runtime backdoor
        tactic: Execution
        comment: BeaverTail / blockchain C2 family also seen in Joyfill (AS66).

